<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Plug inside an archive box</title>
  <rect width="256" height="256" rx="48" fill="#1d5c63"/>
  <!-- open top of the box: inside, with the back and both sides joining the front -->
  <path d="M46 132 L58 104 L198 104 L210 132 Z" fill="#b9811a" stroke="#e3a72f" stroke-width="10" stroke-linejoin="round"/>
  <!-- plug, half inside the box -->
  <rect x="106" y="34" width="12" height="36" rx="5" fill="#ffffff"/>
  <rect x="138" y="34" width="12" height="36" rx="5" fill="#ffffff"/>
  <rect x="90" y="64" width="76" height="80" rx="14" fill="#ffffff"/>
  <rect x="106" y="86" width="44" height="8" rx="4" fill="#1d5c63" opacity="0.25"/>
  <!-- box front -->
  <rect x="40" y="128" width="176" height="96" rx="12" fill="#f2c14e"/>
  <rect x="40" y="128" width="176" height="22" rx="10" fill="#e3a72f"/>
  <rect x="100" y="172" width="56" height="14" rx="7" fill="#1d5c63" opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

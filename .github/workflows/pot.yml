name: Generate POT file

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pot:
    # workflow_dispatch can't be limited to a branch, so skip runs started from any other branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP with WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          tools: wp-cli

      - name: Generate POT file
        run: bash script/generate-pot

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
            commit-message: "Update POT file"
            title: "Update POT file"
            branch: automated/generate-pot
            delete-branch: true

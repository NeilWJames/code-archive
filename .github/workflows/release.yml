# .github/workflows/release.yml
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true
        type: string
  push:
    tags:
      - '*.*.*'          # optional: keep tag-push releases too

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLUG: ${{ github.event.repository.name }}
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null \
             && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Tag $VERSION already exists"; exit 1
          fi

      - name: Check tag matches plugin version
        run: |
          HEADER=$(grep -m1 -i '^[ *]*Version:' "$SLUG.php" | awk '{print $NF}')
          [ "$HEADER" = "$VERSION" ] || { echo "Input $VERSION ≠ header $HEADER"; exit 1; }

      - name: Build distribution folder
        run: |
          mkdir -p "dist/$SLUG"
          rsync -a --exclude-from=.distignore --exclude='.git' --exclude='dist' ./ "dist/$SLUG/"

      - name: Create zip
        run: |
          cd dist
          zip -r "$SLUG-$VERSION.zip" "$SLUG"

      - name: Create GitHub release (and tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "dist/$SLUG-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
name: CI code-archive

on:
  push:
    branches:
      - main
    # A change to the translation template only (the Generate POT PR) needs no tests.
    paths-ignore:
      - 'languages/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'languages/**'
  workflow_dispatch:

# Every job only reads the repository (Codecov uses its own token secret).
permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: true
      matrix:
        operating-system: [ubuntu-latest]
        php-versions: ['8.2', '8.3', '8.4']
        wp-version: [latest]
        wp-multisite: [0]
        include:
          # Oldest supported WordPress.
          - php-versions: '8.2'
            wp-version: '6.5'
            wp-multisite: 0
            operating-system: 'ubuntu-latest'
          - php-versions: '8.4'
            wp-version: 'latest'
            wp-multisite: 1
            operating-system: 'ubuntu-latest'
    name: PHP ${{ matrix.php-versions }} Test WP ${{ matrix.wp-version }} MS ${{ matrix.wp-multisite }}
    steps:
    - name: Start DB
      run: sudo systemctl start mysql

    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mysqli, zip
        coverage: xdebug
        tools: phpunit:9.6
      env:
        COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Composer install
      run: composer install --optimize-autoloader --prefer-dist

    - name: Install WP Tests
      run: bash script/install-wp-tests wordpress_test root root 127.0.0.1 ${{ matrix.wp-version }}
      env:
        WP_MULTISITE: ${{ matrix.wp-multisite }}

    - name: phpunit tests
      run: |
        echo "define('WP_TESTS_PHPUNIT_POLYFILLS_PATH', '${{ github.workspace }}/vendor/yoast/phpunit-polyfills');" >> /tmp/wordpress-tests-lib/wp-tests-config.php
        phpunit --config=phpunit9.xml
      env:
        WP_MULTISITE: ${{ matrix.wp-multisite }}

    - name: Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
        directory: ${{ github.workspace }}
        verbose: true
        # One flag per upload (Codecov rejects several): one per matrix combination.
        flags: php${{ matrix.php-versions }}-wp${{ matrix.wp-version }}-ms${{ matrix.wp-multisite }}

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: phpcs
        run: bash script/cibuild-phpcs
